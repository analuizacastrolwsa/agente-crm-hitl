name: Agente CRM HITL Diário

on:
  schedule:
    # 11h horário de Brasília (UTC-3) = 14:00 UTC, segunda a sexta
    - cron: '0 14 * * 1-5'
  workflow_dispatch:  # permite rodar manualmente pela aba Actions

jobs:
  rodar-agente:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # evita job travado consumindo minutos

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar agente CRM HITL
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_API_TOKEN: ${{ secrets.HUBSPOT_API_TOKEN }}
          HUBSPOT_API_TOKEN_ANALISE: ${{ secrets.HUBSPOT_API_TOKEN_ANALISE }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_CHANNEL_ANALISE_ID: ${{ secrets.SLACK_CHANNEL_ANALISE_ID }}
        run: python main.py
